<!DOCTYPE html>
<head>
    <title>Employee Salary Tax</title>
</head>
<script>
    function btnFind_onclick(){
        var sal=0, tax10=0, tax20=0, tax30=0, tottax=0, netpay=0; 

        sal=numsal.value;
        sal=parseFloat(sal);
        sal=isNaN(sal) ? 0 : sal;
        
         if(sal>0 && sal<=250000){ //tax 0%
            tax10=0;
            tax20=0;
            tax30=0
            tottax=tax10+tax20+tax30;
            netpay=sal-tottax;
        }
        else if(sal>250000 && sal<=500000){ //tax 10% condition
            tax10=sal-250000;
            tax10=tax10*(10/100);
            tax20=0;
            tax30=0;
            tottax=tax10+tax20+tax30;
            netpay=sal-tottax;
           
        }
        else if(sal>500000 && sal<=1000000){ //tax 20% condition
            tax10=500000-250000;
            tax10=tax10*(10/100);
            tax20=sal-500000;
            tax20=tax20*(20/100);
            tax30=0;
            tottax=tax10+tax20+tax30;
            netpay=sal-tottax;

        }
        else if(sal>1000000){ //tax 30% condition
            tax10=500000-250000;
            tax10=tax10*(10/100);
            tax20=1000000-500000;
            tax20=tax20*(20/100);
            tax30=sal-1000000;
            tax30=tax30*(30/100);
            tottax=tax10+tax20+tax30;
            netpay=sal-tottax;
        }
        // else if(tax>=0){ //If salary 0 or -value
        //     tax10=0;
        //     tax20=0;
        //     tax30=0
        //     tottax=0;
        //     netpay=0
        // }
        else{ //If salary 0 or -value
            tax10=0;
            tax20=0;
            tax30=0
            tottax=0;
            netpay=0
        }
        numsal.value=sal;
        numtax10.value=tax10;
        numtax20.value=tax20;
        numtax30.value=tax30;
        numtottax.value=tottax;
        numnp.value=netpay;
    }
   
</script>
<body>
    <table border="1">
        <tr>
            <td>Employee ID</td>
            <td>
                <input 
                type="number" 
                id="numeid" 
                placeholder="0"
                />
            </td>
        </tr>
        <tr>
            <td>Employee Name</td>
            <td>
                <input 
                type="text" 
                id="tbxename" 
                placeholder="unknown"
                />
            </td>
        </tr>
        <tr>
            <td>Employee Salary</td>
            <td>
                <input 
                type="number" 
                id="numsal" 
                placeholder="0.0"
                step="any"
                />
            </td>
        </tr>
        <tr>
            <td>Tax 10%</td>
            <td>
                <input 
                type="number" 
                id="numtax10" 
                placeholder="0.0"
                readonly="readonly"
                />
            </td>
        </tr>
       <tr>
            <td>Tax 20%</td>
            <td>
                <input 
                type="number" 
                id="numtax20" 
                placeholder="0.0"
                readonly="readonly"
                />
            </td>
        </tr>
       <tr>
            <td>Tax 30%</td>
            <td>
                <input 
                type="number" 
                id="numtax30" 
                placeholder="0.0"
                readonly="readonly"
                />
            </td>
        </tr>
        <tr>
            <td>Total Tax</td>
            <td>
                <input 
                type="number" 
                id="numtottax" 
                placeholder="0.0"
                readonly="readonly"
                />
            </td>
        </tr>
         <tr>
            <td>Net Pay</td>
            <td>
                <input 
                type="number" 
                id="numnp" 
                placeholder="0.0"
                readonly="readonly"
                />
            </td>
        </tr>
        
        <tr>
            <td>
                <input 
                type="button"
                value="cancel"
                onclick="location.href='p007est.html';"
                />
            </td>
            <td>
                <input 
                type="button"
                value="Find"
                onclick="btnFind_onclick();"
                />
            </td>
        </tr>    
    </table>
</body>
</html>
