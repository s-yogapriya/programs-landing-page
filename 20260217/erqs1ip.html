<!DOCTYPE html>
<head>
    <title>Exam Results: Source</title>
</head>
<body>
    <h1>Query String (Student Program)</h1>
    <form action="erqs1op.html">
        <table border="1">
            <tr>
                <td>Roll No.</td>
                <td>
                    <input 
                    type="number" 
                    name="numrno" 
                    placeholder="0"
                    />
                </td>
            </tr>
            <tr>
                <td>Name</td>
                <td>
                    <input 
                    type="text" 
                    name="tbxsname" 
                    placeholder="unknown"
                    />
                </td>
            </tr>
            <tr>
                <td>Mark-1</td>
                <td>
                    <input 
                    type="number" 
                    name="numm1" 
                    placeholder="0.0"
                    step="any"
                    />
            </td>
            <tr>
                <td>Mark-2</td>
                <td>
                    <input 
                    type="number" 
                    name="numm2" 
                    placeholder="0.0"
                    step="any"
                    />
                </td>
            </tr>
            <tr>
                <td>
                    <input 
                    type="button"
                    value="cancel"
                    onclick="location.href='erqs1ip.html';"
                    />
                </td>
                <td>
                    <input 
                    type="submit"
                    value="Find"
                    />
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
