<!DOCTYPE html>

<script>
function btnPass_onclick(){
    chkbxresult.checked=true;
    spnresult.innerText="Pass";
}
function btnFail_onclick(){
    chkbxresult.checked=true;
    spnresult.innerText="Fail";
}
</script>
<body>
    <h1>Checkbox-2</h1>
<input 
type="checkbox"
id="chkbxresult"
disabled="disabled"
/>
<span id="spnresult">Fail</span>

<br/>

<input type="button" value="pass" onclick="btnPass_onclick();"/>

<input type="button" value="Fail" onclick="btnFail_onclick();"/>

</body>
</html>
