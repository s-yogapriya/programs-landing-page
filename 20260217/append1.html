<!DOCTYPE html>
<head>
    <title>Append Assignment Operator</title>       
</head>
<body>
    <h1>Append-1</h1>
<script>
    var s=5;
    document.write("<br>",s);
    s+=9; 			//add the number
    document.write("<br>",s);
    s=25;			//overwrite the number
    document.write("<br>",s);
</script>
</body>
</html>
