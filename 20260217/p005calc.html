<!DOCTYPE html>
<head>
    <title>Calculator</title>
</head>
<script>
    //Parameter alias name is Argument
    function btnCalcu(aop){ //Formal Parameter
        //initialize variables
        var fn=0, sn=0, res=0;

        fn=numfn.value;
        fn=parseFloat(fn);  
        fn=isNaN(fn) ? 0 : fn;

        sn=numsn.value;
        sn=parseFloat(sn);
        sn=isNaN(sn) ? 0 : sn;

        // if (aop.equals('+')) {
        //     res=fn+sn;
        // }
        // else if(aop.equals('-')){
        //     res=fn-sn;
        // }
        // else if(aop.equals('*')){
        //     res=fn*sn;
        // }
        // else if(aop.equals('/')){
        //     res=fn/sn;
        // }
        // else if(aop.equals('%')){
        //     res=fn%sn;
        // }
        // else if(aop.equals('^')){
        //     res=fn**sn;
        // }else{
        //     res=0;
        // }

        //speed up code
         if (aop === '+' ) {
            res=fn+sn;
        }
        else if(aop === '-'){
            res=fn-sn;
        }
        else if(aop == '*'){
            res=fn*sn;
        }
        else if(aop == '/'){
            res=fn/sn;
        }
        else if(aop == '%'){
            res=fn%sn;
        }
        else if(aop == '^'){
            res=fn**sn;
        }else{
            res=0;
        }

        numfn.value=fn;
        numsn.value=sn;
        numres.value=res;
    }    
</script>
<body>
    <h1>Calculator</h1>
    <table border="1">
        <tr>
            <td>First Number</td>
            <td>
                <input 
                type="number" 
                id="numfn" 
                placeholder="0.0"
                step="any"
                />
            </td>
        </tr>
        <tr>
            <td>Second Number</td>
            <td>
                <input 
                type="number" 
                id="numsn" 
                placeholder="0.0"
                step="any"
                />
            </td>
        </tr>
        <tr>
            <td>Result</td>
            <td>
                <input 
                type="number" 
                id="numres" 
                placeholder="0.0"
                step="any"
                />
            </td>
        </tr>     
        <tr>
            <td>
                <input 
                type="button"
                value="cancel"
                onclick="location.href='p005cal.html';"
                />
                <input 
                type="button"
                value="+"
                onclick="btnCalcu('+');" 
                />
                <input 
                type="button"
                value="-"
                onclick="btnCalcu('-');"
                />
                
            </td>
            <td>
                <input 
                type="button"
                value="*"
                onclick="btnCalcu('*');"
                />
                   <input 
                type="button"
                value="/"
                onclick="btnCalcu('/');"
                />
                <input 
                type="button"
                value="%"
                onclick="btnCalcu('%');"
                />
                <input 
                type="button"
                value="^"
                onclick="btnCalcu('^');"
                />
            </td>
        </tr>    
    </table>
</body>
</html>
