<!DOCTYPE html>
<html>
<head>
<title>if else statement</title>
</head>
  <body>
    <h1>if else Conditional statement</h1>
   <Script>
    var num=9;
    if (num%2==0){
        document.write("The " + num + " number is Even")
    }
    else{
        document.write("The " + num + " number is Odd")
    }

   </Script>
</body>
</html>
