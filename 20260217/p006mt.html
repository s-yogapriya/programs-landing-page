<!DOCTYPE html>
<head>
    <title>Multiplication Table</title>
</head>
<script>
    function btnFind(){
        var num=nummn.value;
        num=parseFloat(num);
        num=isNaN(num) ? 0 : num;

        var op="";

        for(var i=1;i<=20;i++){
            op += i + "*"+ num + "=" + i*num + "<br>";
        }
        spnop.innerHTML = op;       
    }
</script>
<body>
    <h1>Multiplication Table Using Span</h1>
    <table border="1">
        <tr>
            <td>Multiplication Number</td>
            <td>
                <input 
                type="number" 
                id="nummn" 
                placeholder="0"
                />
            </td>
        </tr>  
        <tr> 
            <td>
                <input 
                type="button"
                value="cancel"
                onclick="location.href='p006mt.html';"
                />
            </td>
            <td>
                <input 
                type="button"
                value="Find"
                onclick="btnFind();" 
                />
            </td>
        </tr> 
        <tr>
            <td colspan="2">
                <span 
                id="spnop">
                </span>
            </td>
        </tr>
    </table>
</body>
</html>
