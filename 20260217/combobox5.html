<!DOCTYPE html>
<!--file name: combobox4.html--> 
<head>
    <title>combobox using span</title>
</head>
<script>
    function cmbbxcc_onclick(){
        spop.innerText=cmbbxcc.value;
    }
</script>
<select id="cmbbxcc" onclick="cmbbxcc_onclick();">
    <option value="AGRICULTURE">Agriculture</option>
    <option value="DOMESTIC">Domestic</option>
    <option value="COMMERCIAL" selected="selected">Commercial</option>
</select>

<span id="spop">Wait...</span>

</html>
