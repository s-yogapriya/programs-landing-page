<html>
    <head>
        <title>Relational Operator2</title>
    </head>
    <body>
        <h1>Relational Operator-2</h1>
    </body>
    <script>
        document.write("<b>Relational Operator Using Same Numbers </b> </br></br>");
        document.write("10 < 10 : " + (10 < 10) + "</br>");
        document.write("10 <= 10 : " + (10 <= 10) + "</br>");
        document.write("10 > 10 : " + (10 > 10) + "</br>");
        document.write("10 >= 10 : " + (10 >= 10) + "</br>");
        document.write("10 == 10 : " + (10 == 10) + "</br>");
        document.write("10 == 10 : " + (10 == 10) + "</br>");
        document.write("10 != 10 : " + (10 != 10) + "</br>");
    </script>
    <body></body>
</html>
