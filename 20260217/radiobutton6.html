    <!DOCTYPE html>
<head>
    <title>Pass - Fail & ON - OFF</title>
</head>

<body>
<h1>Radiobutton - Single selections</h1>

<h2>Pass - Fail</h2>
<input 
type="radio"
id="rdobtnPass"
name="passfail"
/>Pass

<input 
type="radio"
id="rdobtnFail"
name="passfail"
/>Fail

<br><br>

<h2>ON - OFF</h2>
<input 
type="radio"
id="rdobtnOn"
name="onoff"
/>On

<input 
type="radio"
id="rdobtnOff"
name="onoff"
/>Off

</body>
</html>
