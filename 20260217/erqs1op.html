<!DOCTYPE html>
<head>
    <title>Exam Results: Target</title>
</head>
<a href="erqs1ip.html">Home</a><br><br>

<body>
    <table border="1">
        <tr>
            <td>Roll No.</td>
            <td>
                <input 
                type="number" 
                id="numrno" 
                placeholder="0"
                />
            </td>
        </tr>
        <tr>
            <td>Name</td>
            <td>
                <input 
                type="text" 
                id="tbxsname" 
                placeholder="unknown"
                />
            </td>
        </tr>
        <tr>
            <td>Mark-1</td>
            <td>
                <input 
                type="number" 
                id="numm1" 
                placeholder="0.0"
                step="any"
                />
        </td>
        <tr>
            <td>Mark-2</td>
            <td>
                <input 
                type="number" 
                id="numm2" 
                placeholder="0.0"
                step="any"
                />
            </td>
        </tr>
        <tr>
            <td>Total</td>
            <td>
                <input 
                type="number" 
                id="numtotal" 
                placeholder="0.0"
                step="any"
                readonly="readonly"
                />
            </td>
        </tr>
        <tr>
            <td>Average</td>
            <td>
                <input 
                type="number" 
                id="numavg" 
                placeholder="0.0"
                step="any"
                readonly="readonly"
                />
            </td>
        </tr>
        <tr>
            <td>Result</td>
            <td>
                <input 
                type="text" 
                id="tbxres" 
                placeholder="nil"
                readonly="readonly"
                />
            </td>
        </tr>
            
    </table>
</body>
<script>
    var params=new URL(window.location.href).searchParams;
    // document.write('<br>Query String:',params,'<br>');
    
    
    var rno=params.has('numrno') ? params.get('numrno') : 0;
    rno=parseFloat(rno);
    rno=isNaN(rno) ? 0 : rno;

    var sname=params.has('tbxsname') ? params.get('tbxsname') : 0;
    // document.write('<br>QueryString value:',rno);
    var m1=params.has('numm1') ? params.get('numm1') : 0;
    m1=parseFloat(m1);
    m1=isNaN(m1) ? 0 : m1;
    // document.write('<br>QueryString value:',m1);
    var m2=params.has('numm2') ? params.get('numm2') : 0;
    m2=parseFloat(m2);
    m2=isNaN(m2) ? 0 : m2;
    // document.write('<br>QueryString value:',m2);


    var total=0, avg=0, res='Fail';
    total=m1+m2;        
    avg=total/2;
    res=(m1>34.4 && m2>34.4) ? 'Pass' : 'Fail';


    numrno.value=rno;
    tbxsname.value=sname;
    numm1.value=m1;
    numm2.value=m2;
    numtotal.value=total;
    numavg.value=avg;
    tbxres.value=res;
    
</script>
</html>
