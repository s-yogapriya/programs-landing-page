<!DOCTYPE html>
<h1>Radiobutton-2</h1>

<script>
function uToFloat(s){

var n=parseFloat(s);
n = isNaN(n) ? 0 : n;
return n;
}

function btnFind_onclick(){

var m1=uToFloat(numm1.value);
var m2=uToFloat(numm2.value);

if(m1 > 34.4 && m2 > 34.4){
rdobtnPass.checked=true;
}
else{
rdobtnFail.checked=true;
}
}

</script>

Mark-1
<input 
type="number"
step="any"
id="numm1"
placeholder="0.0"
/>

<br/>

Mark-2
<input 
type="number"
step="any"
id="numm2"
placeholder="0.0"
/>

<br/>

<input 
type="radio"
name="result"
id="rdobtnPass"
disabled="disabled"
/>Pass

<br/>

<input 
type="radio"
name="result"
id="rdobtnFail"
disabled="disabled"
/>Fail

<br/>


<input 
type="button"
value="Find"
onclick="btnFind_onclick();"
/>
</html>
