<!DOCTYPE html>
<head>
    <title>Cool Drinks Checkbox</title>
</head>
<body>
    <h1>Auto Default Selection</h1>
    <table border="1">
        <tr>
            <td>Hot Drink</td>
            <td>
                <input 
                type="checkbox"
                name="output"
                id="chkbxcoffee"
                disabled="disabled"
                />Coffee
                <input 
                type="checkbox"
                name="output"
                id="chkbxtea"
                disabled="disabled"
                />Tea
                 <input 
                type="checkbox"
                name="output"
                id="chkbxmilk"
                disabled="disabled"
                />Milk
            </td>
        </tr>
         <tr>
            <td>Cool Drink</td>
            <td>
                <input 
                type="checkbox"
                name="output"
                id="chkbx7up"
                disabled="disabled"
                />7 Up
                <input 
                type="checkbox"
                name="output"
                id="chkbxpepsi"
                disabled="disabled"
                />Pepsi
                 <input 
                type="checkbox"
                name="output"
                id="chkbxcoke"
                disabled="disabled"
                />Coke
                 <tr>
            <td>Soft Drink</td>
            <td>
                <input 
                type="checkbox"
                name="output"
                id="chkbxorange"
                disabled="disabled"
                />Orange
                <input 
                type="checkbox"
                name="output"
                id="chkbxapple" 
                disabled="disabled"         
                />Apple
                 <input 
                type="checkbox"
                name="output"
                id="chkbxgraphs"
                disabled="disabled"
                />Graphs
            </td>
        </tr>
            </td>
        </tr>
    </table>
    
</body>
<script>
    chkbxcoffee.checked=true;
    chkbxtea.checked=false;
    chkbxmilk.checked=false;
    chkbx7up.checked=false;
    chkbxpepsi.checked=true;   
    chkbxcoke.checked=true;
    chkbxorange.checked=false;
    chkbxapple.checked=false;
    chkbxgraphs.checked=false;
</script>


</html>
