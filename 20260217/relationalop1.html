<html>
    <head>
        <title>Relational Operator1</title>
    </head>
    <body>
        <h1>Relational Operator-1</h1>
    </body>
    <script>
        document.write("<b>Relational Operator Using Different Numbers </b> </br></br>");
        document.write("9 < 5 : " + (9 < 5) + "</br>");
        document.write("9 <= 5 : " + (9 <= 5) + "</br>");
        document.write("9 > 5 : " + (9 > 5) + "</br>");
        document.write("9 >= 5 : " + (9 >= 5) + "</br>");
        document.write("9 == 5 : " + (9 == 5) + "</br>");
        document.write("9 == 5 : " + (9 == 5) + "</br>");
        document.write("9 != 5 : " + (9 != 5) + "</br>");
    </script>
    <body></body>
</html>
