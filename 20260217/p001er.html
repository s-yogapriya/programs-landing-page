<!DOCTYPE html>
<head>
    <title>Exam Results</title>
</head>
<script>
    function btnFind_onclick(){
        //below initialize variables
        var m1=0, m2=0, total=0, avg=0, res='Fail';
        m1=numm1.value;
        m1=parseFloat(m1);
        m1=isNaN(m1) ? 0 : m1;
        
        m2=numm2.value;
        m2=parseFloat(m2);
        m2=isNaN(m2) ? 0 : m2;

        total=m1+m2;        
        avg=total/2;
        res=(m1>34.4 && m2>34.4) ? 'Pass' : 'Fail';
        numm1.value=m1;
        numm2.value=m2;
        numtotal.value=total;
        numavg.value=avg;
        tbxres.value=res;   

    }
</script>
<body>
    <h1>Exam Result</h1>
    <table border="1">
        <tr>
            <td>Roll No.</td>
            <td>
                <input 
                type="number" 
                id="numrno" 
                placeholder="0"
                />
            </td>
        </tr>
        <tr>
            <td>Name</td>
            <td>
                <input 
                type="text" 
                id="tbxsname" 
                placeholder="unknown"
                />
            </td>
        </tr>
        <tr>
            <td>Mark-1</td>
            <td>
                <input 
                type="number" 
                id="numm1" 
                placeholder="0.0"
                step="any"
                />
        </td>
        <tr>
            <td>Mark-2</td>
            <td>
                <input 
                type="number" 
                id="numm2" 
                placeholder="0.0"
                step="any"
                />
            </td>
        </tr>
        <tr>
            <td>Total</td>
            <td>
                <input 
                type="number" 
                id="numtotal" 
                placeholder="0.0"
                step="any"
                readonly="readonly"
                />
            </td>
        </tr>
        <tr>
            <td>Average</td>
            <td>
                <input 
                type="number" 
                id="numavg" 
                placeholder="0.0"
                step="any"
                readonly="readonly"
                />
            </td>
        </tr>
        <tr>
            <td>Result</td>
            <td>
                <input 
                type="text" 
                id="tbxres" 
                placeholder="nil"
                readonly="readonly"
                />
            </td>
        </tr>
        <tr>
            <td>
                <input 
                type="button"
                value="cancel"
                onclick="location.href='p001er.html';"
                />
            </td>
            <td>
                <input 
                type="button"
                value="Find"
                onclick="btnFind_onclick();"
                />
            </td>
        </tr>    
    </table>
</body>
</html>
