<!DOCTYPE html>
<head>
    <title>Append Assignment Operator</title>
</head>
<body>
    <h1>Append-2</h1>
<script>
    var s="5";
    document.write("<br>",s);
    s+="9"; 			//append number as string
    document.write("<br>",s);
    s="25";			//overwrite number as string
    document.write("<br>",s);
</script>
</body>
</html>
