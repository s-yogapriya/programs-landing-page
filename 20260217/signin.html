<!DOCTYPE html>
<head>
    <title>Signin</title>    
</head>
<h1>Basic Singin page</h1>
<body>
<form action="validate.html">
    <table border="1">
        <tr>
            <td>Username</td>
            <td>
                <input
                type="text" 
                name="tbxun"/>
            </td>
        </tr>
         <tr>
            <td>Password</td>
            <td>
                <input
                type="password" 
                name="upwd"/>
            </td>
        </tr>
        <tr>
            <td>
                <input 
                type="button"
                value="Cancel"
                onclick="location.href='signin.html';"/>
            </td>
            <td>
                <input 
                type="submit"
                value="Signin"
                />
            </td>
        </tr>
    </table>
</form>
</body>
</html>
